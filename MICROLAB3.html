const D=(()=>{let s=7;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;return Array.from({length:240},()=>{const g=Math.min(5,Math.max(.8,3.3+(r()+r()+r()-1.5)*1.3)),f=Math.min(100,Math.max(0,(3.4-g)*20+(r()-.4)*30)),a=r()<(g<2.6?.35:.1)?1:0,p=r()<.45?1:0,z=-1.2+(3.3-g)*1.1+f/100*1.4+a*1.1-p*.9+(r()-.5)*1.4;return{g,f,a,p,d:r()<1/(1+Math.exp(-z))?1:0}})})();
const CAP=48;
function sim(){const z=S.gz;let tp=0,fp=0,fn=0,tn=0;D.forEach(x=>{const fl=(x.g<z.g)+(x.f>z.f)+(z.a&&x.a)+(z.n&&!x.p),al=fl>=z.k;if(al&&x.d)tp++;else if(al)fp++;else if(x.d)fn++;else tn++});
const pr=tp/Math.max(1,tp+fp),rc=tp/Math.max(1,tp+fn),f1=pr+rc?2*pr*rc/(pr+rc):0,al=tp+fp,adj=al>CAP?f1*.7:f1;return{tp,fp,fn,tn,pr,rc,f1,al,adj}}

function simUI(){const z=S.gz;return `<p>Cohorte <b>sintética</b> de 240 primíparos (no son datos reales). Como en el artículo, la universidad solo puede atender al 20 % (48 alertas). Configura tu regla y maximiza el F1.</p><details class=fbk open style="margin:10px 0"><summary><b>📘 ¿Cómo funciona este laboratorio? (lee antes de empezar)</b></summary>
<p><b>1. Qué estás haciendo.</b> Eres el equipo de analítica de una universidad. Debes decidir <i>a quién avisarle</i> que está en riesgo de desertar, usando solo datos que ya existen en los sistemas (como en el artículo). Tu regla se prueba sobre 240 estudiantes ficticios de los que ya sabemos quién desertó.</p>
<p><b>2. La regla de banderas.</b> Cada estudiante suma una bandera por cada señal de riesgo que cumpla: promedio bajo el umbral, créditos reprobados sobre el umbral, ausencia intersemestral y falta de beca o apoyo (estas dos se activan con las casillas). Si suma <b>k banderas o más</b>, se genera una alerta.</p>
<p><b>3. Ejemplo con 4 estudiantes.</b> Regla: promedio &lt; 3,0; reprobados &gt; 30 %; usar ausencia y “sin beca”; k = 2.</p>
<table><tr><th>Estudiante</th><th>Datos</th><th>Banderas</th><th>¿Alerta?</th><th>¿Desertó?</th><th>Resultado</th></tr>
<tr><td>Ana</td><td>2,8 · 40 % · sin ausencia · con beca</td><td>2</td><td>Sí</td><td>Sí</td><td><b>VP</b></td></tr>
<tr><td>Luis</td><td>3,6 · 10 % · ausente · sin beca</td><td>2</td><td>Sí</td><td>No</td><td><b>FP</b></td></tr>
<tr><td>Marta</td><td>2,9 · 5 % · sin ausencia · con beca</td><td>1</td><td>No</td><td>Sí</td><td><b>FN</b></td></tr>
<tr><td>Pedro</td><td>4,0 · 0 % · sin ausencia · con beca</td><td>0</td><td>No</td><td>No</td><td><b>VN</b></td></tr></table>
<p><b>4. Acrónimos (matriz de confusión).</b></p>
<ul><li><b>VP, verdadero positivo:</b> hubo alerta y sí desertó. Es un acierto: se pudo acompañar a tiempo.</li>
<li><b>FP, falso positivo:</b> hubo alerta pero continuó. Es una falsa alarma: gasta la capacidad de Bienestar.</li>
<li><b>FN, falso negativo:</b> no hubo alerta y desertó. Es un caso perdido, el error más costoso.</li>
<li><b>VN, verdadero negativo:</b> no hubo alerta y continuó. Es un acierto silencioso.</li></ul>
<p><b>5. Métricas.</b> <b>Precisión</b> = VP ÷ (VP + FP): de las alertas emitidas, qué proporción era real. <b>Sensibilidad</b> = VP ÷ (VP + FN): de quienes desertaron, qué proporción detectaste. <b>F1</b> equilibra ambas: 2 × precisión × sensibilidad ÷ (precisión + sensibilidad).</p>
<p><b>6. Ejemplo con la configuración inicial</b> (promedio &lt; 3,0; reprobados &gt; 30 %; ambas casillas activas; k = 2): VP = 34, FP = 36, FN = 33, VN = 137 (suman 240). Precisión = 34 ÷ 70 ≈ 49 %; sensibilidad = 34 ÷ 67 ≈ 51 %; F1 ≈ 0,50. Pero generó 70 alertas y Bienestar solo atiende 48, así que el F1 se multiplica por 0,7 y obtiene 14 de 40 puntos.</p>
<p><b>7. Otro ejemplo, regla más estricta</b> (promedio &lt; 3,2; reprobados &gt; 25 %; ambas casillas; k = 3): VP = 17, FP = 10, FN = 50, VN = 163. Solo 27 alertas (dentro de la capacidad) y precisión de 63 %, pero sensibilidad de 25 %: avisas poco, aciertas más y pierdes muchos casos. Es el dilema central: <i>más sensibilidad suele costar más falsas alarmas</i>.</p>
<p><b>8. ¿De dónde salen los estudiantes ficticios?</b> A cada uno se le calcula un riesgo: sube si tiene promedio bajo, muchos créditos reprobados o ausencia, y baja si tiene apoyo. Una fórmula (la función logística) convierte ese riesgo en una probabilidad entre 0 % y 100 %, y luego se sortea con esa probabilidad si desertó. Por eso hay azar: dos estudiantes con el mismo perfil pueden terminar distinto, y ninguna regla acierta siempre.</p>
<p><b>Cómo ganar puntos:</b> mueve los controles hasta lograr un buen equilibrio sin pasar de 48 alertas, pulsa “Registrar mi mejor configuración” y luego justifica tu regla en la reflexión.</p></details><div class=g>

<div>Créditos reprobados &gt; <b id=sfv></b> %<input type=range id=sf min=0 max=80 step=5 value=${z.f} oninput=simUpd()></div>
<div>Alertas si hay ≥ <b id=skv></b> banderas<input type=range id=sk min=1 max=4 value=${z.k} oninput=simUpd()></div>
<div><label><input type=checkbox id=sa style="width:auto" ${z.a?'checked':''} onchange=simUpd()> Usar ausencia intersemestral</label><br><label><input type=checkbox id=sn style="width:auto" ${z.n?'checked':''} onchange=simUpd()> Usar “sin beca o apoyo”</label></div></div>
<div id=so></div><button class=bt onclick=simSave()>Registrar mi mejor configuración</button> <small id=simm></small><div id="fb_sim">${fbBox('sim')}</div><h2 style="margin-top:14px">Reflexión crítica</h2>${form('sim')}`}

<div id=rdt class=rdt></div><textarea id=rdx rows=10 style="display:none;margin-top:10px"></textarea></div></div>
<div class=rdp><button id=rdpv title="Frase anterior">«</button><button id=rdpl class=pl>▶</button><button id=rdsto title="Detener">■</button><button id=rdrr title="Reiniciar">↻</button><input type=range id=rdr min=0 max=0 value=0><small id=rdst>Listo para leer</small><button id=rdsp>1.0×</button><button id=rdfm>A−</button><button id=rdfp>A+</button><button id=rdg title="Opciones de voz">⚙</button></div></div>`;
rdTok();rdView();rdVoices();if(SS)SS.onvoiceschanged=rdVoices;
$('rda').onchange=rdAcc;$('rdv2').onchange=()=>{RD.voice=RD._vs[+$('rdv2').value]||null;rdBadge();if(RD.pl)rdSpeak(RD.cur)};
$('rdrs').oninput=e=>rdRate(+e.target.value);$('rdvo').oninput=e=>{RD.vol=+e.target.value;$('rdvt').textContent=RD.vol+'%'};
$('rdtv').onclick=()=>{rdStop();const u=new SpeechSynthesisUtterance('Hola, esta es una prueba de la voz seleccionada.');u.voice=RD.voice;u.lang=RD.voice?RD.voice.lang:'es-CO';u.rate=RD.rate;u.volume=RD.vol/100;SS.speak(u)};
$('rdt').onclick=e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!==undefined){RD.pl=true;RD.bs=false;rdBtn();rdSpeak(+i)}};
$('rdpl').onclick=rdPlay;$('rdsto').onclick=()=>{rdStop();RD.cur=0;rdMark(0);rdSt('Detenido')};$('rdrr').onclick=()=>{RD.cur=0;RD.pl=true;RD.bs=false;rdBtn();rdSpeak(0)};
$('rdpv').onclick=()=>{let i=Math.max(0,RD.cur-1);while(i>0&&!/[.!?…]$/.test(RD.w[i-1].w))i--;rdFrom(i)};
$('rdr').oninput=e=>rdFrom(+e.target.value);
$('rdsp').onclick=()=>{const L=[.8,1,1.25,1.5,2],k=L.findIndex(x=>x>RD.rate+.01);rdRate(L[k<0?0:k])};
$('rdfm').onclick=()=>{RD.fs=Math.max(14,RD.fs-2);$('rdt').style.fontSize=RD.fs+'px'};$('rdfp').onclick=()=>{RD.fs=Math.min(34,RD.fs+2);$('rdt').style.fontSize=RD.fs+'px'};
$('rdg').onclick=()=>{const p=$('rdvp');p.style.display=p.style.display==='none'?'':'none'};
$('rdf').onclick=()=>$('rdi').click();$('rdi').onchange=e=>{if(e.target.files[0])rdFile(e.target.files[0])};
$('rde').onclick=()=>{const x=$('rdx'),ed=x.style.display==='none';if(ed){rdStop();x.value=S.rd;x.style.display='block';$('rdt').style.display='none';$('rde').textContent='✔ Listo';x.focus()}else{x.style.display='none';$('rdt').style.display='';$('rde').textContent='✏️ Editar';rdSetText(x.value)}};
rdRate(RD.rate)}
function go(){rdStop();const tb=[[3,'📖 LEER'],[0,'Sesión 1'],[1,'Sesión 2'],[2,'Guía']].map(x=>`<button class="${S.s===x[0]?'on':''}" onclick="S.s=${x[0]};S.r=0;sv();go()">${x[1]}</button>`).join('');$('tabs').innerHTML=tb;
if(S.s===3){rdInit();hdr();return}
if(S.s===2){$('app').innerHTML=GUIDE;return}
const L=ST[S.s],st=L[S.r];$('app').innerHTML=`<div class=st>${L.map((x,i)=>`<button class="${S.r===i?'on':''}" onclick="S.r=${i};sv();go()">${x.n} <small>(${x.m}′)</small></button>`).join('')}</div><div class=card><h2>${st.n}</h2>${st.h()}</div>`;hdr();if(S.s===1&&S.r===1)simUpd()}
let T=3600,iv=null;function tm(){if(iv){clearInterval(iv);iv=null;return}iv=setInterval(()=>{T=Math.max(0,T-1);$('tmb').textContent='⏱ '+String(Math.floor(T/60)).padStart(2,'0')+':'+String(T%60).padStart(2,'0')},1000)}
go();
</script></body></html>
