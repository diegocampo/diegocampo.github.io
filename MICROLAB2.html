<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Debugging Lógico</title>
<style>
:root{--bg:#faf8f3;--fg:#1c1b22;--card:#fff;--mut:#6b6a73;--ac:#c27c0e;--ok:#1f8a4c;--bad:#c0392b;--bd:#e4dfd3;--dk:#1c1b2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141b;--fg:#ecebf0;--card:#1f1e28;--mut:#9a98a6;--bd:#34323f;--dk:#0d0c12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15141b;--fg:#ecebf0;--card:#1f1e28;--mut:#9a98a6;--bd:#34323f;--dk:#0d0c12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-family:Georgia,serif;margin:0;font-size:1.6rem}h1 span{color:var(--ac)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd)}
.st{display:flex;gap:8px;flex-wrap:wrap}.pill{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-weight:600;font-size:.9rem}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){main.g{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 6px;font-size:1.1rem}.mut{color:var(--mut);font-size:.9rem}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}
textarea{min-height:90px}
.opt{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.q{font-weight:600;margin:12px 0 4px}
#rd{position:relative;white-space:pre-wrap;font-family:Georgia,serif;font-size:1.05rem;line-height:1.8;max-height:380px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--bg)}
.w{cursor:pointer;border-radius:3px}.w:hover{background:rgba(194,124,14,.2)}.w.on{background:var(--ac);color:#fff}
.bar{background:var(--dk);color:#fff;border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.bar button{background:#2e2d40;padding:6px 12px}.bar input[type=range]{width:90px}
#pg{flex:1;min-width:80px;height:6px;background:#3a3950;border-radius:4px;overflow:hidden}#pg i{display:block;height:100%;width:0;background:var(--ac)}
.fb{padding:10px 12px;border-radius:10px;margin-top:12px;background:var(--bg);border-left:4px solid var(--ac)}.ok{border-color:var(--ok)}.no{border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.it{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;margin:6px 0}

.tm{color:var(--bad)}
</style></head><body>
<header><h1>Debugging <span>Lógico</span></h1><div class="st" id="hd"></div></header>
<main id="m"></main>
<script>
const $=id=>document.getElementById(id),RO=["Lector","Auditor","Escriba"];
const SES=[
{n:"Sesión 1 · Misión Bagdad",tt:"Cap. II de El hombre que calculaba (fragmento)",
txt:`CAPÍTULO II
Donde Beremiz Samir, el Hombre que Calculaba, cuenta la historia de su vida.

-Me llamo Beremiz Samir, y nací en la pequeña aldea de Khoi, en Persia, a la sombra de la pirámide inmensa formada por el monte Ararat. Siendo aún muy joven empecé a trabajar como pastor al servicio de un rico señor de Khamat. […] Mi generoso amo poseía, en dos o tres distantes oasis, grandes plantaciones de datileras, e, informado de mis habilidades matemáticas, me encargó dirigir la venta de sus frutos, contados por mí en los racimos, uno a uno. Trabajé así al pie de las palmeras cerca de diez años. […] ahora voy a Bagdad pues quiero visitar a unos parientes y admirar las bellas mezquitas y los suntuosos palacios de la famosa ciudad.

Y señalándome una vieja higuera que se erguía a poca distancia, prosiguió:
-Aquel árbol, por ejemplo, tiene doscientas ochenta y cuatro ramas. Sabiendo que cada rama tiene como promedio, trescientos cuarenta y seis hojas, es fácil concluir que aquel árbol tiene un total de noventa y ocho mil quinientos cuarenta y ocho hojas. ¿No cree, amigo mío?
-¡Maravilloso! –exclamé atónito. […] Esta habilidad puede procurarle a cualquier persona inmensas riquezas.

-Su admirable habilidad –le expliqué- puede emplearse en veinte mil casos distintos. En una gran capital como Constantinopla, o incluso en Bagdad, sería usted un auxiliar precioso para el Gobierno. […] Le aseguro […] que no le será difícil obtener algún puesto destacado junto al califa Al-Motacén, nuestro amo y señor. Tal vez pueda llegar al cargo de visir-tesorero o desempeñar las funciones de secretario de la Hacienda musulmana.`,
L:[
{t:"Lectura guiada",m:10,i:"Lean con el lector (turnen la lectura en voz alta entre los 3).",qs:[{q:"Marquen los 3 datos que SÍ aparecen en el texto",mu:1,o:["Beremiz nació en Khoi, Persia","Trabajó cerca de diez años con los dátiles de su amo","La higuera tiene 284 ramas","Beremiz viaja a Bagdad en su propio caballo","Beremiz tiene cuarenta años"],a:[0,1,2]}],fb:"Marco narrativo: Khoi (Persia), pastor en Khamat, diez años contando dátiles y viaje a Bagdad en el camello del narrador."},
{t:"Nivel 1 · Marco y tesis",m:8,i:"Identifiquen la tesis central del NARRADOR.",qs:[{q:"¿Cuál es la tesis?",o:["Beremiz debe volver a Khoi con su amo","La habilidad de contar de Beremiz lo cualifica para un alto cargo en el Gobierno de Bagdad","Contar abejas es más difícil que contar hojas","El califa busca un pastor para su rebaño"],a:[1]}],fb:"La tesis es la recomendación profesional: del talento de contar se concluye que puede ser visir-tesorero.",h:"Busquen qué quiere lograr el narrador con sus palabras."},
{t:"Nivel 2 · Átomos lógicos",m:10,i:"Asignen cada frase a su proposición atómica: p, q o r.",as:{o:["p","q","r"],items:[["cada rama tiene como promedio 346 hojas","q"],["el árbol tiene un total de 98.548 hojas","r"],["el árbol tiene 284 ramas","p"]]},fb:"p y q son premisas numéricas; r es la conclusión deductiva.",b:"Lógico Atómico",h:"La conclusión es lo que se obtiene después de multiplicar."},
{t:"Nivel 3 · El auditor",m:10,i:"Auditen el cálculo con la calculadora. Descompongan 346 = 300 + 40 + 6.",ca:[["284 × 346 =",98264],["Diferencia con lo afirmado (98.548 − resultado) =",284]],fb:"284×300=85.200; 284×40=11.360; 284×6=1.704; suma = 98.264. El texto dice 98.548: sobran 284 hojas. La premisa derivativa r es falsa.",b:"Auditor Numérico",h:"284×346 = 284×300 + 284×40 + 284×6"},
{t:"Nivel 4 · Función lógica",m:7,i:"Formalicen la estructura y descubran lo que no se dice.",qs:[{q:"Estructura inferencial",o:["(p ∧ q) → r","r → (p ∧ q)","p ∨ q","p → (q ∨ r)"],a:[0]},{q:"Premisa implícita (entimema) del narrador",o:["Bagdad tiene mezquitas muy bellas","Quien cuenta rápido elementos de la naturaleza puede administrar las finanzas de un Estado","El califa es muy generoso","Los camellos viajan más lento que los caballos"],a:[1]}],fb:"Si p y q son verdaderas, r debe ser su producto exacto. El entimema salta del conteo a la gobernanza fiscal.",h:"Si p y q, entonces r."},
{t:"Nivel 5 · Validez y solidez",m:7,i:"Clasifiquen el argumento completo.",qs:[{q:"Evaluación",o:["Sólido: todas las premisas son verdaderas","No sólido: la premisa aritmética es falsa (98.548 ≠ 98.264) y el entimema es falaz","Sólido pero inválido","Válido y sólido porque suena convincente"],a:[1]},{q:"Diferencia entre validez y solidez",o:["Validez: forma que lleva de premisas a conclusión. Solidez: además las premisas son verdaderas","Validez: premisas verdaderas. Solidez: buena redacción","Son sinónimos","Solidez: solo la forma. Validez: solo los datos"],a:[0]}],fb:"Un argumento es sólido si es válido y todas sus premisas son verdaderas. Aquí falla la verdad de las premisas.",h:"La solidez exige verdad de las premisas."},
{t:"Jefe final · Falacias",m:8,i:"Cacen las falacias y escriban sus hallazgos.",qs:[{q:"Falacias del narrador",mu:1,o:["Pendiente resbaladiza","Ad hominem","Composición","Falso dilema"],a:[0,2]}],w:{q:"Redacten sus hallazgos: tesis, error aritmético, falacias y por qué el argumento no es sólido.",min:150,mod:"Modelo: La tesis del narrador es que la habilidad de Beremiz lo cualifica para ser visir-tesorero. Su cálculo falla: 284×346=98.264, no 98.548. El argumento comete composición (de la micro-tarea de contar a la gestión macro del Estado) y pendiente resbaladiza (de contar hojas a ser tesorero). Por eso no es sólido."},fb:"Falacias: composición y pendiente resbaladiza.",b:"Cazafalacias",h:"Una parte se proyecta al todo; un paso lleva a una cadena sin eslabones."}
]},
{n:"Sesión 2 · Misión Fake News",tt:"El impacto de las noticias falsas · Raúl Guizado",
txt:`EL IMPACTO DE LAS NOTICIAS FALSAS
Raúl Guizado

Las noticias falsas son un problema cada vez más prevalente en la era digital. Muchas veces, estas noticias son difundidas a través de las redes sociales y pueden tener un gran impacto en la forma en que pensamos y tomamos decisiones. Por esa razón, es esencial ser crítico y evaluar la veracidad de cualquier noticia antes de compartirla. Es importante también recordar que las noticias falsas pueden ser creadas con el propósito de manipular nuestras opiniones o para obtener ganancias económicas. Además, las noticias falsas pueden tener consecuencias graves, como la propagación de desinformación o el aumento de la polarización política que, en última instancia, crea caos y violencia.

Por ello, para evitar ser engañado por noticias falsas, es importante verificar la veracidad de la información y no compartir noticias sin antes verificarlas. También es fundamental fijarse en el lenguaje y la forma del texto y buscar múltiples fuentes de información para tener una visión más amplia del tema. Además, es esencial desarrollar una mente crítica y estar atento a las posibles manipulaciones y falacias lógicas presentes en un texto.

En conclusión, las noticias falsas pueden tener un impacto significativo en la sociedad y es importante estar alerta para evitar caer en la trampa de la desinformación. Al desarrollar estrategias de pensamiento crítico como el contraste de la información o la verificación de la fiabilidad de las fuentes de dicha información, podemos protegernos de las noticias falsas y asegurarnos de que estamos informados de manera confiable.`,
L:[
{t:"Lectura guiada",m:10,i:"Lean con el lector, turnándose los párrafos.",qs:[{q:"Marquen lo que SÍ afirma el texto",mu:1,o:["Pueden crearse para manipular opiniones o ganar dinero","Hay que buscar múltiples fuentes de información","Solo circulan por televisión","La polarización política puede crear caos y violencia","Compartir sin verificar es recomendable"],a:[0,1,3]}],fb:"El texto advierte del riesgo y prescribe verificar y contrastar fuentes."},
{t:"Nivel 1 · Tesis central",m:8,i:"Redacten la tesis con sus palabras (compárenla luego con la propuesta).",w:{q:"Escriban la tesis central del texto en una o dos oraciones.",min:80,mod:"Modelo: Ante el riesgo de manipulación y polarización que generan las noticias falsas en la era digital, es indispensable desarrollar un pensamiento crítico activo mediante la verificación y el contraste de fuentes para decidir con información confiable."},fb:"Una buena tesis incluye problema (riesgo), medio (pensamiento crítico) y finalidad (decidir informados)."},
{t:"Nivel 2 · Átomos lógicos",m:12,i:"Primero auditen el ejemplo: dice que el texto tiene 8 oraciones. Cuéntenlas.",ca:[["¿Cuántas oraciones tiene realmente el texto?",10]],as:{o:["p","q","r","s","t"],items:[["podemos protegernos y estar informados de manera confiable","t"],["pueden crearse para manipular opiniones o ganar dinero","q"],["son un problema cada vez más prevalente en la era digital","p"],["es esencial desarrollar una mente crítica: verificar y contrastar fuentes","s"],["pueden tener consecuencias graves: desinformación, polarización","r"]]},fb:"El texto tiene 10 oraciones (5 + 3 + 2), no 8: ¡error detectado en el ejemplo! Las 5 proposiciones atómicas siguen cubriendo el sentido.",b:"Lógico Atómico",h:"Cuenten los puntos finales, párrafo por párrafo."},
{t:"Nivel 3 · Función lógica",m:7,i:"Estructura causa-efecto del texto.",qs:[{q:"¿Qué enlaza p ∧ q con r?",o:["(p ∧ q) → r: la manipulación en entornos digitales produce consecuencias graves","r → (p ∧ q)","p ∨ q","¬p → s"],a:[0]},{q:"¿Por qué se propone s?",o:["Porque s evita r (s → ¬r)","Porque s produce q","Porque p es falsa","Porque t es una premisa"],a:[0]}],fb:"Diagnóstico: p y q producen r. Prescripción: s neutraliza r.",h:"Causa → efecto → remedio."},
{t:"Nivel 4 · Cazar el error",m:10,i:"El ejemplo afirma que [(p∧q→r)∧(s→¬r)] ⇒ s es válido (Modus Tollens/Ponens) y sólido. ¿Es cierto?",qs:[{q:"¿Qué falla en esa validez?",o:["Nada: es válido por Modus Ponens","De s → ¬r no se sigue s: falta la premisa normativa de que ¬r es deseable. Es un argumento prescriptivo con entimema, no deductivo puro","Solo falta la premisa p","Modus Tollens es válido siempre, sin importar premisas"],a:[1]},{q:"¿Qué premisa debilita la solidez?",o:["Las noticias falsas existen en redes sociales","Que la polarización cree en última instancia caos y violencia, sin evidencia en el texto","Que verificar fuentes ayuda","Que el texto tiene título"],a:[1]}],fb:"Para concluir s hace falta añadir: ¬r es deseable (premisa valorativa). Sin ella, el esquema afirma el consecuente.",b:"Cazador de Errores",h:"¿Qué premisa oculta convierte 'evita el daño' en 'debemos hacerlo'?"},
{t:"Jefe final · Falacias y debugging",m:13,i:"Detecten defectos y optimicen el texto.",qs:[{q:"Defectos del texto",mu:1,o:["Pendiente resbaladiza (leve)","Redundancia","Ad hominem","Cita de autoridad sin referencias"],a:[0,1]}],w:{q:"Reescriban en 3 o 4 frases un solo bloque que fusione verificación, análisis del lenguaje y contraste de fuentes, sin repetir.",min:120,mod:"Modelo: Para no ser engañados, verifiquemos cada noticia antes de compartirla: analicemos su lenguaje y su forma, contrastemos varias fuentes confiables y estemos atentos a manipulaciones y falacias."},fb:"Pendiente resbaladiza (polarización → caos y violencia) y redundancia (verificar se repite en el párrafo 2 y en la conclusión).",b:"Cazafalacias",h:"Hay un salto sin eslabones y una idea dicha dos veces."}
]}];
let S={},words=[],TXT="",voices=[];
const cur=()=>SES[S.s].L[S.l];
function hd(){const t=Math.max(S.sec||0,0),mm=String(Math.floor(t/60)).padStart(2,"0"),ss=String(t%60).padStart(2,"0");$("hd").innerHTML=S.team?`<span class="pill">${S.team}</span><span class="pill ${t<300?"tm":""}" id="tm">⏱ ${mm}:${ss}</span><span class="pill">⭐ ${S.xp} XP</span><span class="pill">${"❤️".repeat(S.lives)||"💔"}</span>`:""}
function start0(){let b=[];try{b=JSON.parse(localStorage.getItem("dbgb")||"[]")}catch(e){}
$("m").className="";$("m").innerHTML=`<div class="card" style="max-width:560px;margin:auto"><h2>Equipos de 3 personas</h2><p class="mut">Cada nivel tiene un líder distinto que escribe la respuesta del equipo; los otros dos revisan. 60 minutos por sesión · 3 vidas · pistas −20 XP.</p><input type="text" id="tn" placeholder="Nombre del equipo" value="Equipo 1"><div class="row"><input type="text" id="m0" placeholder="Integrante 1" value="Ana"><input type="text" id="m1" placeholder="Integrante 2" value="Luis"><input type="text" id="m2" placeholder="Integrante 3" value="Sara"></div><div class="row"><button onclick="go(0)">Iniciar Sesión 1</button><button onclick="go(1)">Iniciar Sesión 2</button></div>${b.length?`<h2 style="margin-top:18px">Marcador</h2>`+b.sort((x,y)=>y.xp-x.xp).map((x,i)=>`<div>${i+1}. ${x.team} (${x.ses}) — <b>${x.xp} XP</b></div>`).join(""):""}</div>`}
function go(s){S={s,l:0,xp:0,lives:3,sec:3600,badges:[],rep:[],team:$("tn").value||"Equipo",mem:[0,1,2].map(i=>$("m"+i).value||"Integrante "+(i+1)),tries:0,hints:0,ls:Date.now()};clearInterval(S.iv);S.iv=setInterval(()=>{S.sec--;hd()},1000);hd();lvl()}
function lvl(){const L=cur(),n=SES[S.s].L.length;S.tries=0;S.ls=Date.now();S.hu=0;
const lead=S.mem[S.l%3];
let h=`<div class="card"><h2>${SES[S.s].n}</h2><div class="mut">${SES[S.s].tt}</div>${S.l==0?"":""}<div id="rd"></div><div class="bar"><button id="pl">▶</button><button id="pa">⏸</button><button id="st">■</button><button id="am">A−</button><button id="ap">A+</button><div id="pg"><i></i></div><span>🔊</span><input type="range" id="vo" min="0" max="100" value="80"><span>⚡</span><input type="range" id="ra" min="5" max="15" value="10"></div><div class="row"><select id="vs" style="flex:1"></select></div><div class="mut" style="margin-top:6px">Clic en una palabra para leer desde ahí. La voz depende de su navegador y dispositivo.</div></div>`;
h+=`<div class="card"><div class="mut">Nivel ${S.l+1} de ${n} · ~${L.m} min · Líder: <b>${lead}</b> (${RO[S.l%3]})</div><h2>${L.t}</h2><p>${L.i}</p><div id="lv">`;
(L.qs||[]).forEach((q,i)=>{h+=`<div class="q">${q.q}${q.mu?" (varias)":""}</div>`+q.o.map((x,j)=>[x,j]).sort(()=>Math.random()-.5).map(([x,j])=>`<label class="opt"><input type="${q.mu?"checkbox":"radio"}" name="q${i}" value="${j}"> ${x}</label>`).join("")});
if(L.as)h+=`<div class="q">Asignen la proposición</div>`+L.as.items.map((it,i)=>`<div class="it"><span>«${it[0]}»</span><select id="a${i}"><option value="">?</option>${L.as.o.map(o=>`<option>${o}</option>`).join("")}</select></div>`).join("");
if(L.ca)h+=`<div class="q">Calculadora del auditor</div>`+L.ca.map((c,i)=>`<div class="it"><span>${c[0]}</span><input type="text" id="c${i}" inputmode="numeric"></div>`).join("")+`<div class="row"><input type="text" id="cin" placeholder="Operación, ej. 284*300" style="flex:1"><button class="s" onclick="try{$('cout').textContent='= '+Function('return '+$('cin').value.replace(/[^0-9+*/().-]/g,''))()}catch(e){$('cout').textContent='?'}">Calcular</button><b id="cout"></b></div>`;
if(L.w)h+=`<div class="q">${L.w.q}</div><textarea id="w"></textarea>`;
h+=`</div><div id="ms"></div><div class="row" id="bt"><button onclick="chk()">Comprobar</button><button class="s" onclick="hint()">💡 Pista (−20 XP)</button></div></div>`;
$("m").className="g";$("m").innerHTML=h;setText(SES[S.s].txt);tts()}
function msg(t,c){$("ms").innerHTML=`<div class="fb ${c||""}">${t}</div>`}
function hint(){const L=cur();S.xp=Math.max(0,S.xp-20);S.hints++;S.hu++;hd();msg("💡 "+(L.h||"Relean el texto y discutan en equipo."))}
function chk(){const L=cur();let ok=true;
(L.qs||[]).forEach((q,i)=>{const v=[...document.querySelectorAll(`[name=q${i}]:checked`)].map(e=>+e.value).sort().join();if(v!==q.a.join())ok=false});
if(L.as)L.as.items.forEach((it,i)=>{if($("a"+i).value!==it[1])ok=false});
if(L.ca)L.ca.forEach((c,i)=>{if($("c"+i).value.replace(/[.,\s]/g,"")!==String(c[1]))ok=false});
let wv="";if(L.w){wv=$("w").value.trim();if(wv.length<L.w.min){msg("Escriban al menos "+L.w.min+" caracteres (llevan "+wv.length+").");return}}
S.tries++;
if(ok){let g=100;if((Date.now()-S.ls)/1000<L.m*60)g+=30;if(S.tries>1)g-=40;S.xp+=g;if(L.b&&S.tries==1&&!S.badges.includes(L.b))S.badges.push(L.b);fin(true,g,wv)}
else{S.lives--;if(S.lives<=0){S.lives=1;S.xp=Math.max(0,S.xp-50)}hd();if(S.tries>=2){S.xp+=30;fin(false,30,wv)}else msg("Algo no coincide. Pierden una vida: discutan en equipo y revisen. Pueden usar una pista.","no")}}
function fin(ok,g,wv){const L=cur();hd();S.rep.push(`${L.t}${wv?": "+wv:""}`);
$("lv").querySelectorAll("input,select,textarea").forEach(e=>e.disabled=true);
$("ms").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"¡Correcto! +"+g+" XP":"Revelamos la respuesta (+"+g+" XP)"}</b><br>${L.fb}${L.w?"<br><br><i>"+L.w.mod+"</i>":""}</div>`;
$("bt").innerHTML=`<button onclick="nx()">${S.l+1<SES[S.s].L.length?"Siguiente nivel →":"Terminar misión"}</button>`}
function nx(){S.l++;S.l<SES[S.s].L.length?lvl():end()}
function end(){clearInterval(S.iv);speechSynthesis.cancel();const r=S.xp>=700?"Debugger Maestro":S.xp>=450?"Auditor Lógico":"Aprendiz de Lógica";
if(S.hints==0)S.badges.push("Sin pistas");
const rep=`INFORME · ${SES[S.s].n}\nEquipo: ${S.team} (${S.mem.join(", ")})\nXP: ${S.xp} · Rango: ${r} · Pistas: ${S.hints}\nInsignias: ${S.badges.join(", ")||"—"}\n\n`+S.rep.map((x,i)=>(i+1)+". "+x).join("\n");
try{const b=JSON.parse(localStorage.getItem("dbgb")||"[]");b.push({team:S.team,ses:S.s+1,xp:S.xp});localStorage.setItem("dbgb",JSON.stringify(b))}catch(e){}
$("m").className="";$("m").innerHTML=`<div class="card" style="max-width:640px;margin:auto"><h2>🏆 ${S.team}: ${r}</h2><p><b>${S.xp} XP</b> · ${S.hints} pistas</p><div>${S.badges.map(b=>`<span class="bd">🏅 ${b}</span>`).join("")}</div><div class="q">Informe del equipo</div><textarea id="rp" style="min-height:200px">${rep}</textarea><div class="row"><button onclick="$('rp').select();try{navigator.clipboard.writeText($('rp').value)}catch(e){document.execCommand('copy')}">Copiar informe</button><button class="s" onclick="start0()">Volver al inicio / marcador</button></div></div>`}
// ---- Lector TTS ----
function setText(t){TXT=t;const rd=$("rd");rd.innerHTML="";words=[];let p=0;t.split(/(\s+)/).forEach(x=>{if(!x)return;if(/^\s+$/.test(x)){rd.append(x);p+=x.length;return}const s=document.createElement("span");s.className="w";s.textContent=x;const i=words.length;s.onclick=()=>speak(i);rd.append(s);words.push({s,p});p+=x.length})}
function hi(a){let k=0;for(let i=0;i<words.length;i++){if(words[i].p<=a)k=i;else break}document.querySelectorAll(".w.on").forEach(e=>e.classList.remove("on"));const w=words[k].s;w.classList.add("on");const r=$("rd");if(w.offsetTop<r.scrollTop+10||w.offsetTop>r.scrollTop+r.clientHeight-50)r.scrollTop=Math.max(0,w.offsetTop-50);$("pg").firstChild.style.width=(100*k/words.length)+"%"}
var TK=0,fb=null;
function speak(f){speechSynthesis.cancel();clearInterval(fb);const tk=++TK,st=words[f].p;hi(st);const sub=TXT.slice(st),re=/[^.!?\n]+[.!?]*\s*/g,parts=[];let m;while((m=re.exec(sub)))parts.push({o:st+m.index,t:m[0]});
const v=voices.find(x=>x.name==$("vs").value),R=$("ra").value/10;
parts.forEach((c,ci)=>{const u=new SpeechSynthesisUtterance(c.t);if(v){u.voice=v;u.lang=v.lang}else u.lang="es-CO";u.rate=R;u.volume=$("vo").value/100;let got=0;
u.onstart=()=>{if(tk!=TK)return;got=0;clearInterval(fb);hi(c.o);let el=0,last=Date.now();fb=setInterval(()=>{const n=Date.now();if(!speechSynthesis.paused)el+=n-last;last=n;if(got||tk!=TK)return;hi(c.o+Math.min(c.t.length-1,Math.floor(el/(70/R))))},100)};
u.onboundary=e=>{if(tk!=TK)return;got=1;hi(c.o+e.charIndex)};
u.onend=()=>{if(tk!=TK)return;clearInterval(fb);if(ci==parts.length-1)$("pg").firstChild.style.width="100%"};
speechSynthesis.speak(u)})}
function tts(){const ld=()=>{voices=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)).sort((a,b)=>(/es-CO/i.test(b.lang)-/es-CO/i.test(a.lang)));if($("vs"))$("vs").innerHTML=voices.length?voices.map(v=>`<option>${v.name}</option>`).join(""):"<option>Voz predeterminada (sin voces es)</option>"};ld();speechSynthesis.onvoiceschanged=ld;
$("pl").onclick=()=>{if(speechSynthesis.paused)speechSynthesis.resume();else speak(0)};$("pa").onclick=()=>speechSynthesis.pause();$("st").onclick=()=>{TK++;clearInterval(fb);speechSynthesis.cancel();document.querySelectorAll(".w.on").forEach(e=>e.classList.remove("on"));$("pg").firstChild.style.width="0"};
let fz=1.05;$("am").onclick=()=>{fz=Math.max(.8,fz-.1);$("rd").style.fontSize=fz+"rem"};$("ap").onclick=()=>{fz=Math.min(1.8,fz+.1);$("rd").style.fontSize=fz+"rem"}}
start0();
</script></body></html>
